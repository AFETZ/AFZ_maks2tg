services:
  max2tg:
    build: .
    network_mode: ${DOCKER_NETWORK_MODE:-bridge}
    restart: unless-stopped
    init: true
    environment:
      MAX_TOKEN:
      MAX_DEVICE_ID:
      MAX_CHAT_IDS:
      TG_BOT_TOKEN:
      TG_CHAT_ID:
      TG_PROXY:
      TG_READ_TIMEOUT:
      TG_WRITE_TIMEOUT:
      TG_MEDIA_WRITE_TIMEOUT:
      DEBUG:
      REPLY_ENABLED:
      LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
